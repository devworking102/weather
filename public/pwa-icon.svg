<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- Safe zone filled to edges for maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Sun -->
  <circle cx="200" cy="210" r="78" fill="url(#sun)"/>

  <!-- Cloud -->
  <g fill="#ffffff">
    <circle cx="210" cy="320" r="58"/>
    <circle cx="280" cy="300" r="72"/>
    <circle cx="350" cy="320" r="56"/>
    <rect x="200" y="320" width="160" height="70" rx="35"/>
  </g>

  <!-- Rain drops -->
  <g fill="#bae6fd">
    <path d="M230 410 q-8 12 0 24 q8 -12 0 -24z"/>
    <path d="M280 420 q-8 12 0 24 q8 -12 0 -24z"/>
    <path d="M330 410 q-8 12 0 24 q8 -12 0 -24z"/>
  </g>
</svg>
